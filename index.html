<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Essensplan</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EA;
    --card:#FFFDF8;
    --ink:#2B2620;
    --muted:#8C8775;
    --herb:#4A6741;
    --herb-light:#7A9471;
    --herb-pale:#E4EADD;
    --butter:#E8B84B;
    --butter-pale:#FBEDC9;
    --line:#E4DFD0;
    --danger:#B4483B;
    --danger-pale:#F5E2DE;
    --radius:16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Figtree',sans-serif; overscroll-behavior-y:none;}
  body{padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); min-height:100vh;}
  .app{max-width:480px; margin:0 auto; padding:0 14px 100px; min-height:100vh; position:relative;}

  /* Header */
  .topbar{padding:18px 4px 10px; display:flex; align-items:baseline; justify-content:space-between;}
  .brand{font-family:'Fraunces',serif; font-weight:600; font-style:italic; font-size:26px; color:var(--herb); letter-spacing:-0.01em;}
  .brand .dot{color:var(--butter);}

  /* Tabs */
  .tabs{display:flex; gap:6px; background:var(--herb-pale); padding:4px; border-radius:12px; margin:6px 0 18px;}
  .tab-btn{flex:1; border:none; background:transparent; padding:9px 0; font-family:'Figtree',sans-serif; font-weight:600; font-size:14px; color:var(--herb); border-radius:9px; cursor:pointer; transition:.15s;}
  .tab-btn.active{background:var(--card); box-shadow:0 1px 3px rgba(43,38,32,0.12); color:var(--ink);}

  .view{display:none;}
  .view.active{display:block;}

  /* Week nav */
  .weeknav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding:2px 2px;}
  .weeknav button{background:var(--card); border:1px solid var(--line); width:36px; height:36px; border-radius:10px; font-size:16px; color:var(--herb); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .weeknav button:active{background:var(--herb-pale);}
  .weeknav-mid{text-align:center; cursor:pointer;}
  .weeknav-kw{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .weeknav-range{font-family:'Fraunces',serif; font-weight:500; font-size:16px; margin-top:1px;}
  .today-btn{font-size:11px; color:var(--herb); font-weight:600; text-decoration:underline; text-underline-offset:2px; margin-top:2px; display:inline-block;}

  /* Day rows */
  .day-row{display:flex; background:var(--card); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; box-shadow:0 1px 2px rgba(43,38,32,0.06); border:1px solid var(--line);}
  .day-row.today{border-color:var(--butter);}
  .day-tab{width:52px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--herb-pale); padding:10px 4px;}
  .day-row.today .day-tab{background:var(--butter-pale);}
  .day-tab .wd{font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:17px; color:var(--herb); line-height:1;}
  .day-row.today .day-tab .wd{color:#7A5A12;}
  .day-tab .dd{font-size:11px; color:var(--muted); margin-top:3px; font-weight:600;}
  .day-slots{flex:1; padding:6px 12px;}
  .slot{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); cursor:pointer;}
  .slot:last-child{border-bottom:none;}
  .slot-label{font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--herb-light); width:22px; flex-shrink:0;}
  .slot-text{font-size:14.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .slot-text.empty{color:var(--muted); font-weight:400;}
  .slot-text.filled{color:var(--ink); font-weight:500;}

  /* Ideas view */
  .search-wrap{margin-bottom:14px;}
  .search-input{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-family:'Figtree',sans-serif; font-size:15px; color:var(--ink);}
  .search-input:focus{outline:none; border-color:var(--herb-light);}
  .idea-item{display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 12px; margin-bottom:8px;}
  .idea-name{flex:1; font-size:15px; font-weight:500;}
  .idea-note{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .idea-actions{display:flex; gap:6px;}
  .icon-btn{background:var(--herb-pale); border:none; width:32px; height:32px; border-radius:9px; color:var(--herb); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .icon-btn.del{background:var(--danger-pale); color:var(--danger);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty-state .big{font-family:'Fraunces',serif; font-style:italic; font-size:19px; color:var(--herb); margin-bottom:6px;}

  /* FAB */
  .fab{position:fixed; right:calc(50% - 240px + 18px); bottom:calc(24px + var(--safe-bottom)); width:54px; height:54px; border-radius:50%; background:var(--herb); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(74,103,65,0.4); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:20;}
  @media (max-width:516px){ .fab{right:18px;} }

  /* Sheet / modal */
  .overlay{position:fixed; inset:0; background:rgba(43,38,32,0.42); display:none; align-items:flex-end; z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:10px 20px calc(24px + var(--safe-bottom)); max-height:86vh; overflow-y:auto; animation:slideup .22s ease-out;}
  @keyframes slideup{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:6px auto 14px;}
  .sheet-title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin-bottom:4px;}
  .sheet-sub{font-size:13px; color:var(--muted); margin-bottom:16px;}
  .field-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--herb); margin:14px 0 6px;}
  .field-input, .field-textarea{width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--card); font-family:'Figtree',sans-serif; font-size:15px; color:var(--ink);}
  .field-input:focus, .field-textarea:focus{outline:none; border-color:var(--herb-light);}
  .idea-pick-list{max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:11px; background:var(--card); margin-top:2px;}
  .idea-pick{padding:10px 13px; font-size:14.5px; border-bottom:1px solid var(--line); cursor:pointer;}
  .idea-pick:last-child{border-bottom:none;}
  .idea-pick:active{background:var(--herb-pale);}
  .idea-pick-empty{padding:14px; font-size:13px; color:var(--muted); text-align:center;}
  .btn-row{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; padding:13px; border-radius:12px; border:none; font-family:'Figtree',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;}
  .btn-primary{background:var(--herb); color:#fff;}
  .btn-secondary{background:var(--herb-pale); color:var(--herb);}
  .btn-danger{background:var(--danger-pale); color:var(--danger);}
  .btn-ghost{background:transparent; color:var(--muted); text-decoration:underline;}
  .divider-or{text-align:center; font-size:11.5px; color:var(--muted); margin:16px 0 4px; text-transform:uppercase; letter-spacing:.08em; position:relative;}
  .sync-dot{position:fixed; top:calc(10px + var(--safe-top)); right:14px; width:8px; height:8px; border-radius:50%; background:var(--herb-light); z-index:60; transition:background .3s;}
  .sync-dot.offline{background:var(--danger);}

  /* Lock screen */
  .lock-overlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  .lock-brand{font-family:'Fraunces',serif; font-weight:600; font-style:italic; font-size:26px; color:var(--herb); margin-bottom:28px;}
  .lock-dots{display:flex; gap:14px; margin-bottom:26px;}
  .lock-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--herb-light); background:transparent; transition:.15s;}
  .lock-dot.filled{background:var(--herb); border-color:var(--herb);}
  .lock-dot.err{border-color:var(--danger); background:var(--danger);}
  .lock-keypad{display:grid; grid-template-columns:repeat(3,64px); gap:14px; justify-content:center;}
  .lock-key{width:64px; height:64px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-family:'Figtree',sans-serif; font-size:22px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .lock-key:active{background:var(--herb-pale);}
  .lock-key.wide{background:transparent; border:none; font-size:15px; color:var(--muted); font-weight:500;}
  .lock-error{color:var(--danger); font-size:13px; margin-top:14px; min-height:16px;}
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-brand">Essensplan<span style="color:var(--butter);">.</span></div>
  <div class="lock-dots" id="lockDots">
    <div class="lock-dot"></div><div class="lock-dot"></div><div class="lock-dot"></div><div class="lock-dot"></div>
  </div>
  <div class="lock-keypad" id="lockKeypad">
    <button class="lock-key" data-k="1">1</button>
    <button class="lock-key" data-k="2">2</button>
    <button class="lock-key" data-k="3">3</button>
    <button class="lock-key" data-k="4">4</button>
    <button class="lock-key" data-k="5">5</button>
    <button class="lock-key" data-k="6">6</button>
    <button class="lock-key" data-k="7">7</button>
    <button class="lock-key" data-k="8">8</button>
    <button class="lock-key" data-k="9">9</button>
    <div></div>
    <button class="lock-key" data-k="0">0</button>
    <button class="lock-key wide" data-k="del">⌫</button>
  </div>
  <div class="lock-error" id="lockError"></div>
</div>

<div class="sync-dot" id="syncDot"></div>
<div class="app">
  <div class="topbar">
    <div class="brand">Essensplan<span class="dot">.</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="woche">Woche</button>
    <button class="tab-btn" data-tab="ideen">Ideen</button>
  </div>

  <!-- WOCHE -->
  <div class="view active" id="view-woche">
    <div class="weeknav">
      <button id="prevWeek">‹</button>
      <div class="weeknav-mid" id="todayBtn">
        <div class="weeknav-kw" id="kwLabel">KW 33</div>
        <div class="weeknav-range" id="rangeLabel">10.–16. Aug</div>
      </div>
      <button id="nextWeek">›</button>
    </div>
    <div id="daysContainer"></div>
  </div>

  <!-- IDEEN -->
  <div class="view" id="view-ideen">
    <div class="search-wrap">
      <input type="text" class="search-input" id="ideaSearch" placeholder="Ideen durchsuchen…">
    </div>
    <div id="ideasContainer"></div>
  </div>

  <button class="fab" id="fabAdd">+</button>
</div>

<!-- Sheet: Slot bearbeiten -->
<div class="overlay" id="slotOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="slotSheetTitle">Mittags · Mo 10.08.</div>
    <div class="sheet-sub">Text eingeben oder eine Idee auswählen</div>

    <div class="field-label">Freitext</div>
    <input type="text" class="field-input" id="slotTextInput" placeholder="z. B. Nudelauflauf">

    <div class="divider-or">oder aus Ideen wählen</div>
    <input type="text" class="field-input" id="slotIdeaSearch" placeholder="Ideen durchsuchen…" style="margin-top:8px;">
    <div class="idea-pick-list" id="slotIdeaList"></div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="slotCancel">Abbrechen</button>
      <button class="btn btn-primary" id="slotSave">Speichern</button>
    </div>
    <div style="text-align:center; margin-top:12px;">
      <button class="btn-ghost" id="slotDelete" style="display:none; background:none; border:none; font-family:'Figtree',sans-serif; font-size:13px;">Eintrag löschen</button>
    </div>
  </div>
</div>

<!-- Sheet: Löschen bestätigen -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Eintrag löschen</div>
    <div class="sheet-sub">Was soll mit „<span id="confirmDishName"></span>“ passieren?</div>
    <div class="btn-row" style="flex-direction:column;">
      <button class="btn btn-secondary" id="confirmToIdeas">Zurück in die Ideen</button>
      <button class="btn btn-danger" id="confirmForever">Endgültig löschen</button>
      <button class="btn btn-ghost" id="confirmCancel" style="background:none;">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Sheet: Idee hinzufügen -->
<div class="overlay" id="ideaOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Neue Idee</div>
    <div class="field-label">Name</div>
    <input type="text" class="field-input" id="ideaNameInput" placeholder="z. B. Gemüsecurry">
    <div class="field-label">Notiz (optional)</div>
    <input type="text" class="field-input" id="ideaNoteInput" placeholder="z. B. mit Kokosmilch">
    <div class="btn-row">
      <button class="btn btn-secondary" id="ideaCancel">Abbrechen</button>
      <button class="btn btn-primary" id="ideaSave">Speichern</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- PIN lock ----------
  const PIN = '1706';
  const LOCK_KEY = 'essensplan_unlocked_v1';
  const lockOverlay = document.getElementById('lockOverlay');
  const lockDots = document.getElementById('lockDots').children;
  const lockError = document.getElementById('lockError');
  let entered = '';

  function refreshDots(err){
    for(let i=0;i<4;i++){
      lockDots[i].className = 'lock-dot' + (i<entered.length ? (err?' err':' filled') : '');
    }
  }
  function unlock(){
    lockOverlay.style.display = 'none';
    try{ localStorage.setItem(LOCK_KEY, '1'); }catch(e){}
  }
  document.getElementById('lockKeypad').addEventListener('click', e=>{
    const btn = e.target.closest('.lock-key');
    if(!btn) return;
    const k = btn.getAttribute('data-k');
    if(k==='del'){ entered = entered.slice(0,-1); lockError.textContent=''; refreshDots(false); return; }
    if(entered.length>=4) return;
    entered += k;
    refreshDots(false);
    if(entered.length===4){
      setTimeout(()=>{
        if(entered===PIN){ unlock(); }
        else{
          lockError.textContent = 'Falscher PIN';
          refreshDots(true);
          setTimeout(()=>{ entered=''; refreshDots(false); }, 400);
        }
      }, 120);
    }
  });
  try{
    if(localStorage.getItem(LOCK_KEY)==='1'){ lockOverlay.style.display='none'; }
  }catch(e){}

  const BASE = 'https://einkaufsliste-die-suehsen-default-rtdb.europe-west1.firebasedatabase.app';
  const ROOT = 'essensplan';

  const SLOTS = [
    {key:'morgens', label:'M', full:'Morgens'},
    {key:'mittags', label:'M', full:'Mittags'},
    {key:'abends',  label:'A', full:'Abends'}
  ];
  // distinct 2-letter labels to avoid confusion
  SLOTS[0].label='FR'; SLOTS[1].label='MI'; SLOTS[2].label='AB';

  const WEEKDAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  let state = { days:{}, ideas:{} };
  let weekStart = mondayOf(new Date());
  let currentSlotCtx = null; // {dateKey, slotKey}
  let pendingDelete = null; // {dateKey, slotKey, dishName}

  // ---------- date helpers ----------
  function mondayOf(d){
    const dt = new Date(d);
    const day = dt.getDay(); // 0 Sun .. 6 Sat
    const diff = (day===0? -6 : 1-day);
    dt.setDate(dt.getDate()+diff);
    dt.setHours(0,0,0,0);
    return dt;
  }
  function fmtKey(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function isoWeekNumber(d){
    const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (dt.getUTCDay()+6)%7;
    dt.setUTCDate(dt.getUTCDate()-dayNum+3);
    const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
    const diff = dt - firstThursday;
    return 1 + Math.round(diff/(7*24*3600*1000));
  }
  function isSameDay(a,b){ return fmtKey(a)===fmtKey(b); }

  // ---------- Firebase REST sync ----------
  const syncDot = document.getElementById('syncDot');
  function setOnline(ok){ syncDot.classList.toggle('offline', !ok); }

  function loadInitial(){
    fetch(`${BASE}/${ROOT}.json`).then(r=>r.json()).then(data=>{
      state = data || {days:{}, ideas:{}};
      state.days = state.days || {};
      state.ideas = state.ideas || {};
      setOnline(true);
      renderAll();
    }).catch(()=>{ setOnline(false); renderAll(); });
  }

  function applyPatch(path, data){
    // path like "/" or "/days/2026-08-10" or "/ideas/-Nabc"
    if(path === '/' || path === ''){
      state = data || {days:{}, ideas:{}};
      state.days = state.days || {};
      state.ideas = state.ideas || {};
      return;
    }
    const parts = path.split('/').filter(Boolean);
    let ref = state;
    for(let i=0;i<parts.length-1;i++){
      const p = parts[i];
      if(!ref[p] || typeof ref[p] !== 'object') ref[p] = {};
      ref = ref[p];
    }
    const last = parts[parts.length-1];
    if(data === null){ delete ref[last]; }
    else { ref[last] = data; }
  }

  function startStream(){
    try{
      const es = new EventSource(`${BASE}/${ROOT}.json`);
      es.addEventListener('put', e=>{
        setOnline(true);
        try{
          const {path, data} = JSON.parse(e.data);
          applyPatch(path, data);
          renderAll();
        }catch(err){}
      });
      es.addEventListener('patch', e=>{
        setOnline(true);
        try{
          const {path, data} = JSON.parse(e.data);
          if(data && typeof data === 'object'){
            Object.keys(data).forEach(k=>applyPatch(path.replace(/\/$/,'')+'/'+k, data[k]));
          }
          renderAll();
        }catch(err){}
      });
      es.onerror = ()=>{ setOnline(false); };
      es.onopen = ()=>{ setOnline(true); };
    }catch(err){ setOnline(false); }
  }

  function putDay(dateKey, dayObj){
    setOnline(true);
    const hasAny = dayObj.morgens || dayObj.mittags || dayObj.abends;
    const url = `${BASE}/${ROOT}/days/${dateKey}.json`;
    fetch(url, {method: hasAny? 'PUT':'DELETE', body: hasAny? JSON.stringify(dayObj): undefined})
      .catch(()=>setOnline(false));
  }

  function putIdea(id, ideaObj){
    fetch(`${BASE}/${ROOT}/ideas/${id}.json`, {method:'PUT', body:JSON.stringify(ideaObj)}).catch(()=>setOnline(false));
  }
  function deleteIdea(id){
    fetch(`${BASE}/${ROOT}/ideas/${id}.json`, {method:'DELETE'}).catch(()=>setOnline(false));
  }
  function pushIdea(ideaObj){
    return fetch(`${BASE}/${ROOT}/ideas.json`, {method:'POST', body:JSON.stringify(ideaObj)})
      .then(r=>r.json()).then(res=>res.name).catch(()=>{ setOnline(false); return null; });
  }

  // ---------- rendering ----------
  const daysContainer = document.getElementById('daysContainer');
  const kwLabel = document.getElementById('kwLabel');
  const rangeLabel = document.getElementById('rangeLabel');

  function renderWeekNav(){
    const monday = weekStart;
    const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
    kwLabel.textContent = `KW ${isoWeekNumber(monday)}`;
    const sameMonth = monday.getMonth()===sunday.getMonth();
    rangeLabel.textContent = sameMonth
      ? `${monday.getDate()}.–${sunday.getDate()}. ${MONTHS[monday.getMonth()]}`
      : `${monday.getDate()}. ${MONTHS[monday.getMonth()]} – ${sunday.getDate()}. ${MONTHS[sunday.getMonth()]}`;
  }

  function renderDays(){
    daysContainer.innerHTML = '';
    const today = new Date();
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(d.getDate()+i);
      const key = fmtKey(d);
      const dayData = state.days[key] || {};
      const row = document.createElement('div');
      row.className = 'day-row' + (isSameDay(d, today) ? ' today':'');

      const tab = document.createElement('div');
      tab.className = 'day-tab';
      tab.innerHTML = `<div class="wd">${WEEKDAYS[i]}</div><div class="dd">${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.</div>`;
      row.appendChild(tab);

      const slotsWrap = document.createElement('div');
      slotsWrap.className = 'day-slots';
      SLOTS.forEach(s=>{
        const val = dayData[s.key];
        const slotEl = document.createElement('div');
        slotEl.className = 'slot';
        slotEl.innerHTML = `<div class="slot-label">${s.label}</div><div class="slot-text ${val?'filled':'empty'}">${val ? escapeHtml(val) : '+ hinzufügen'}</div>`;
        slotEl.addEventListener('click', ()=>openSlotSheet(key, s));
        slotsWrap.appendChild(slotEl);
      });
      row.appendChild(slotsWrap);
      daysContainer.appendChild(row);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const ideasContainer = document.getElementById('ideasContainer');
  function renderIdeas(){
    const q = document.getElementById('ideaSearch').value.trim().toLowerCase();
    const entries = Object.entries(state.ideas || {})
      .filter(([id, idea])=> !q || (idea.name||'').toLowerCase().includes(q))
      .sort((a,b)=> (a[1].name||'').localeCompare(b[1].name||'', 'de'));

    ideasContainer.innerHTML = '';
    if(entries.length === 0){
      ideasContainer.innerHTML = `<div class="empty-state"><div class="big">Noch keine Ideen</div>Tippe auf + um eine hinzuzufügen.</div>`;
      return;
    }
    entries.forEach(([id, idea])=>{
      const el = document.createElement('div');
      el.className = 'idea-item';
      el.innerHTML = `
        <div style="flex:1;">
          <div class="idea-name">${escapeHtml(idea.name||'')}</div>
          ${idea.note ? `<div class="idea-note">${escapeHtml(idea.note)}</div>` : ''}
        </div>
        <div class="idea-actions">
          <button class="icon-btn" data-plan="${id}" title="Einplanen">📅</button>
          <button class="icon-btn del" data-del="${id}" title="Löschen">✕</button>
        </div>`;
      ideasContainer.appendChild(el);
    });
    ideasContainer.querySelectorAll('[data-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> openPlanFromIdea(btn.getAttribute('data-plan')));
    });
    ideasContainer.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-del');
        deleteIdea(id);
        delete state.ideas[id];
        renderIdeas();
      });
    });
  }

  function renderAll(){
    renderWeekNav();
    renderDays();
    renderIdeas();
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.getAttribute('data-tab');
      document.getElementById('view-woche').classList.toggle('active', tab==='woche');
      document.getElementById('view-ideen').classList.toggle('active', tab==='ideen');
      document.getElementById('fabAdd').style.display = tab==='ideen' ? 'flex':'none';
    });
  });
  document.getElementById('fabAdd').style.display = 'none';

  // ---------- week nav ----------
  document.getElementById('prevWeek').addEventListener('click', ()=>{ weekStart.setDate(weekStart.getDate()-7); renderWeekNav(); renderDays(); });
  document.getElementById('nextWeek').addEventListener('click', ()=>{ weekStart.setDate(weekStart.getDate()+7); renderWeekNav(); renderDays(); });
  document.getElementById('todayBtn').addEventListener('click', ()=>{ weekStart = mondayOf(new Date()); renderWeekNav(); renderDays(); });

  // ---------- slot sheet ----------
  const slotOverlay = document.getElementById('slotOverlay');
  const slotSheetTitle = document.getElementById('slotSheetTitle');
  const slotTextInput = document.getElementById('slotTextInput');
  const slotIdeaSearch = document.getElementById('slotIdeaSearch');
  const slotIdeaList = document.getElementById('slotIdeaList');
  const slotDeleteBtn = document.getElementById('slotDelete');

  function openSlotSheet(dateKey, slotDef){
    currentSlotCtx = {dateKey, slotKey: slotDef.key};
    const d = new Date(dateKey);
    const wIdx = (d.getDay()+6)%7;
    slotSheetTitle.textContent = `${slotDef.full} · ${WEEKDAYS[wIdx]} ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`;
    const existing = (state.days[dateKey]||{})[slotDef.key] || '';
    slotTextInput.value = existing;
    slotDeleteBtn.style.display = existing ? 'inline-block' : 'none';
    slotIdeaSearch.value = '';
    renderSlotIdeaList('');
    slotOverlay.classList.add('show');
    setTimeout(()=>slotTextInput.focus(), 50);
  }
  function closeSlotSheet(){ slotOverlay.classList.remove('show'); currentSlotCtx = null; }

  function renderSlotIdeaList(q){
    q = q.trim().toLowerCase();
    const entries = Object.entries(state.ideas||{})
      .filter(([id,idea])=> !q || (idea.name||'').toLowerCase().includes(q))
      .sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||'','de'));
    if(entries.length===0){
      slotIdeaList.innerHTML = `<div class="idea-pick-empty">Keine Ideen gefunden</div>`;
      return;
    }
    slotIdeaList.innerHTML = entries.map(([id,idea])=>
      `<div class="idea-pick" data-id="${id}" data-name="${escapeHtml(idea.name||'')}">${escapeHtml(idea.name||'')}</div>`
    ).join('');
    slotIdeaList.querySelectorAll('.idea-pick').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-id');
        const name = el.getAttribute('data-name');
        saveSlot(name, id);
      });
    });
  }
  slotIdeaSearch.addEventListener('input', ()=> renderSlotIdeaList(slotIdeaSearch.value));

  function saveSlot(text, consumedIdeaId){
    if(!currentSlotCtx) return;
    const {dateKey, slotKey} = currentSlotCtx;
    const dayObj = Object.assign({}, state.days[dateKey]||{});
    dayObj[slotKey] = text.trim();
    if(!dayObj[slotKey]) delete dayObj[slotKey];
    state.days[dateKey] = dayObj;
    putDay(dateKey, dayObj);
    if(consumedIdeaId && state.ideas[consumedIdeaId]){
      deleteIdea(consumedIdeaId);
      delete state.ideas[consumedIdeaId];
    }
    renderDays();
    renderIdeas();
    closeSlotSheet();
  }

  document.getElementById('slotSave').addEventListener('click', ()=>{
    const text = slotTextInput.value.trim();
    if(!text){ closeSlotSheet(); return; }
    saveSlot(text, null);
  });
  document.getElementById('slotCancel').addEventListener('click', closeSlotSheet);
  slotOverlay.addEventListener('click', e=>{ if(e.target===slotOverlay) closeSlotSheet(); });

  slotDeleteBtn.addEventListener('click', ()=>{
    if(!currentSlotCtx) return;
    const {dateKey, slotKey} = currentSlotCtx;
    const dishName = (state.days[dateKey]||{})[slotKey] || '';
    pendingDelete = {dateKey, slotKey, dishName};
    document.getElementById('confirmDishName').textContent = dishName;
    closeSlotSheet();
    document.getElementById('confirmOverlay').classList.add('show');
  });

  // ---------- confirm delete sheet ----------
  const confirmOverlay = document.getElementById('confirmOverlay');
  function closeConfirm(){ confirmOverlay.classList.remove('show'); pendingDelete=null; }
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  confirmOverlay.addEventListener('click', e=>{ if(e.target===confirmOverlay) closeConfirm(); });

  document.getElementById('confirmForever').addEventListener('click', ()=>{
    if(!pendingDelete) return;
    const {dateKey, slotKey} = pendingDelete;
    const dayObj = Object.assign({}, state.days[dateKey]||{});
    delete dayObj[slotKey];
    state.days[dateKey] = dayObj;
    putDay(dateKey, dayObj);
    renderDays();
    closeConfirm();
  });

  document.getElementById('confirmToIdeas').addEventListener('click', ()=>{
    if(!pendingDelete) return;
    const {dateKey, slotKey, dishName} = pendingDelete;
    const dayObj = Object.assign({}, state.days[dateKey]||{});
    delete dayObj[slotKey];
    state.days[dateKey] = dayObj;
    putDay(dateKey, dayObj);
    const newIdea = {name: dishName, note:''};
    pushIdea(newIdea).then(id=>{
      if(id){ state.ideas[id] = newIdea; renderIdeas(); }
    });
    renderDays();
    closeConfirm();
  });

  // ---------- ideas: add ----------
  const ideaOverlay = document.getElementById('ideaOverlay');
  document.getElementById('fabAdd').addEventListener('click', ()=>{
    document.getElementById('ideaNameInput').value='';
    document.getElementById('ideaNoteInput').value='';
    ideaOverlay.classList.add('show');
    setTimeout(()=>document.getElementById('ideaNameInput').focus(),50);
  });
  document.getElementById('ideaCancel').addEventListener('click', ()=> ideaOverlay.classList.remove('show'));
  ideaOverlay.addEventListener('click', e=>{ if(e.target===ideaOverlay) ideaOverlay.classList.remove('show'); });
  document.getElementById('ideaSave').addEventListener('click', ()=>{
    const name = document.getElementById('ideaNameInput').value.trim();
    if(!name) return;
    const note = document.getElementById('ideaNoteInput').value.trim();
    const obj = {name, note};
    pushIdea(obj).then(id=>{
      if(id){ state.ideas[id]=obj; renderIdeas(); }
    });
    ideaOverlay.classList.remove('show');
  });

  // ---------- ideas: plan from idea list ----------
  function openPlanFromIdea(ideaId){
    const idea = state.ideas[ideaId];
    if(!idea) return;
    // switch to Woche tab, open slot sheet for today's Mittags, pre-select this idea via search
    document.querySelector('.tab-btn[data-tab="woche"]').click();
    const todayKey = fmtKey(new Date());
    openSlotSheet(todayKey, SLOTS[1]);
    slotIdeaSearch.value = idea.name;
    renderSlotIdeaList(idea.name);
    slotTextInput.value = '';
  }

  document.getElementById('ideaSearch').addEventListener('input', renderIdeas);

  // ---------- init ----------
  loadInitial();
  startStream();
})();
</script>
</body>
</html>
